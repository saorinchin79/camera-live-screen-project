<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Studio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121417; color: #e8ecf1; font-family: 'Space Grotesk', system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0; font-size: 32px; }
    p { margin: 0; color: #aeb7c2; max-width: 520px; line-height: 1.5; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 8px; font-weight: 700; text-decoration: none; color: #121417; background: #f5a524; }
    a.secondary { background: #22272e; color: #e8ecf1; border: 1px solid #2c333c; }
  </style>
</head>
<body>
  <main>
    <h1>Stream Studio</h1>
    <p>Open the <strong>Admin</strong> to build the split-screen layout, and the <strong>Output</strong> on the display (press F for fullscreen).</p>
    <div class="links">
      <a href="/admin/">Admin · layout editor</a>
      <a class="secondary" href="/output/">Program output · 1920 × 1080</a>
    </div>
  </main>
</body>
</html>
